services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: foundations
      POSTGRES_USER: foundations
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - notes-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundations -d foundations"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  notes-data:
